<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>You just got Swooshed!</title>
  <style>
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }

    body {
      min-height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
      font-family: "Segoe UI", system-ui, sans-serif;
      background: radial-gradient(circle at top, #2a1a4a 0%, #0b0618 55%, #05030c 100%);
      color: white;
      overflow: hidden;
    }

    .page {
      text-align: center;
      padding: 32px 20px;
      max-width: 900px;
    }

    .emoji {
      width: min(420px, 86vw);
      height: auto;
      display: block;
      margin: 0 auto 28px;
      filter: drop-shadow(0 18px 30px rgba(0, 0, 0, 0.45));
      animation: bounce 1.8s ease-in-out infinite;
    }

    h1 {
      font-size: clamp(2.1rem, 7vw, 4.4rem);
      font-weight: 900;
      line-height: 1.15;
      letter-spacing: -0.02em;
      background: linear-gradient(
        90deg,
        #ff4d4d,
        #ff9f1a,
        #ffe600,
        #3dff6e,
        #3d9cff,
        #b26bff,
        #ff4d4d
      );
      background-size: 300% 100%;
      -webkit-background-clip: text;
      background-clip: text;
      color: transparent;
      animation: rainbow 3s linear infinite;
    }

    .tagline {
      margin-top: 18px;
      font-size: 1.05rem;
      opacity: 0.7;
    }

    .secret {
      position: fixed;
      top: 10px;
      right: 10px;
      z-index: 20;
      border: none;
      background: transparent;
      color: rgba(255, 255, 255, 0.08);
      font-size: 11px;
      cursor: pointer;
      padding: 6px 8px;
    }

    .secret:hover,
    .secret:focus {
      color: rgba(255, 255, 255, 0.55);
    }

    .overlay {
      display: none;
      position: fixed;
      inset: 0;
      background: rgba(0, 0, 0, 0.65);
      align-items: center;
      justify-content: center;
      z-index: 30;
    }

    .overlay.open {
      display: flex;
    }

    .modal {
      width: min(360px, 90vw);
      background: #161022;
      border: 1px solid rgba(255, 255, 255, 0.12);
      border-radius: 16px;
      padding: 24px;
      text-align: left;
      box-shadow: 0 20px 50px rgba(0, 0, 0, 0.45);
    }

    .modal h2 {
      font-size: 1.3rem;
      margin-bottom: 16px;
    }

    label {
      display: block;
      font-size: 0.85rem;
      margin-bottom: 6px;
      opacity: 0.8;
    }

    input {
      width: 100%;
      margin-bottom: 14px;
      padding: 10px 12px;
      border-radius: 8px;
      border: 1px solid rgba(255, 255, 255, 0.15);
      background: #0d0916;
      color: white;
      font-size: 1rem;
    }

    .actions {
      display: flex;
      gap: 8px;
      margin-top: 6px;
    }

    .actions button {
      flex: 1;
      border: none;
      border-radius: 8px;
      padding: 10px 12px;
      cursor: pointer;
      font-weight: 700;
    }

    .go {
      background: #7c5cff;
      color: white;
    }

    .cancel {
      background: #2a2438;
      color: white;
    }

    .error {
      min-height: 1.2em;
      color: #ff6b6b;
      font-size: 0.9rem;
      margin-bottom: 8px;
    }

    @keyframes rainbow {
      0% { background-position: 0% 50%; }
      100% { background-position: 300% 50%; }
    }

    @keyframes bounce {
      0%, 100% { transform: translateY(0); }
      50% { transform: translateY(-10px); }
    }
  </style>
</head>
<body>
  <button class="secret" id="secretBtn" type="button">Nothing Out Of Place Here!</button>

  <main class="page">
    <img class="emoji" id="mainImage" src="swoosh.png" alt="" />
    <h1 id="mainTitle">You just got Swooshed!</h1>
    <p class="tagline" id="mainTag">Gotcha.</p>
  </main>

  <div class="overlay" id="loginOverlay">
    <form class="modal" id="loginForm">
      <h2>Log in Required</h2>
      <label for="username">Username</label>
      <input id="username" name="username" autocomplete="off" />
      <label for="password">Password</label>
      <input id="password" name="password" type="password" autocomplete="off" />
      <div class="error" id="loginError"></div>
      <div class="actions">
        <button class="cancel" id="cancelBtn" type="button">Close</button>
        <button class="go" type="submit">Log in</button>
      </div>
    </form>
  </div>

  <script>
    const overlay = document.getElementById("loginOverlay");
    const form = document.getElementById("loginForm");
    const errorBox = document.getElementById("loginError");

    document.getElementById("secretBtn").addEventListener("click", function () {
      errorBox.textContent = "";
      overlay.classList.add("open");
      document.getElementById("username").focus();
    });

    document.getElementById("cancelBtn").addEventListener("click", function () {
      overlay.classList.remove("open");
    });

    overlay.addEventListener("click", function (event) {
      if (event.target === overlay) {
        overlay.classList.remove("open");
      }
    });

    form.addEventListener("submit", function (event) {
      event.preventDefault();
      const username = document.getElementById("username").value;
      const password = document.getElementById("password").value;

      if (username === "Melker" && password === "69420") {
        overlay.classList.remove("open");
        document.getElementById("mainImage").src = "Melker.png";
        document.getElementById("mainTitle").textContent = "EINSHAKAKOAKOAKOKAKOAKAKOAKO";
        document.getElementById("mainTag").textContent = "";
      } else if (username === "Oliver" && password === "67") {
        overlay.classList.remove("open");
        document.getElementById("mainImage").src = "oliver.png";
        document.getElementById("mainTitle").textContent = "Torktumlare";
        document.getElementById("mainTag").textContent = "";
      } else {
        errorBox.textContent = "Wrong username or password.";
      }
    });
  </script>
</body>
</html>
