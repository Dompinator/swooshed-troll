<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>You just got Swooshed!</title>
  <style>
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }

    body {
      min-height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
      font-family: "Segoe UI", system-ui, sans-serif;
      background: radial-gradient(circle at top, #2a1a4a 0%, #0b0618 55%, #05030c 100%);
      color: white;
      overflow: hidden;
    }

    .page {
      text-align: center;
      padding: 32px 20px;
      max-width: 900px;
    }

    .emoji {
      width: min(420px, 86vw);
      height: auto;
      display: block;
      margin: 0 auto 28px;
      filter: drop-shadow(0 18px 30px rgba(0, 0, 0, 0.45));
      animation: bounce 1.8s ease-in-out infinite;
    }

    h1 {
      font-size: clamp(2.1rem, 7vw, 4.4rem);
      font-weight: 900;
      line-height: 1.15;
      letter-spacing: -0.02em;
      background: linear-gradient(
        90deg,
        #ff4d4d,
        #ff9f1a,
        #ffe600,
        #3dff6e,
        #3d9cff,
        #b26bff,
        #ff4d4d
      );
      background-size: 300% 100%;
      -webkit-background-clip: text;
      background-clip: text;
      color: transparent;
      animation: rainbow 3s linear infinite;
      text-shadow: none;
    }

    p {
      margin-top: 18px;
      font-size: 1.05rem;
      opacity: 0.7;
    }

    @keyframes rainbow {
      0% { background-position: 0% 50%; }
      100% { background-position: 300% 50%; }
    }

    @keyframes bounce {
      0%, 100% { transform: translateY(0); }
      50% { transform: translateY(-10px); }
    }
  </style>
</head>
<body>
  <main class="page">
    <img class="emoji" src="swoosh.png" alt="Laughing emoji pointing at you" />
    <h1>You just got Swooshed!</h1>
    <p>Gotcha.</p>
  </main>
</body>
</html>
